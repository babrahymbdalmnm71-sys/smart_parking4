name: smart_parking
description: تطبيق مواقف سيارات ذكي احترافي باستخدام Firebase و Riverpod
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.2.1
  
  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  
  # Local Storage & Utilities
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.1
  shared_preferences: ^2.3.5
  intl: ^0.20.3
  google_fonts: ^6.2.1
  image_picker: ^1.1.0
  path_provider: ^2.1.3
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
